# 一次 tag 触发的完整发布：内容 → 两端产物 → 就绪检查 → Pages → Release。
#
# ═══════════════════════════════════════════════════════════════════════════════
# 两种发布模式（2026-10-19 接线）
# ───────────────────────────────────────────────────────────────────────────────
#   · `release`（**默认**，`push` 的 tag 路径**永远**是它）：正常升版发布。
#     门要求 APP_VERSION 与 versionCode **递增**（`app-version-bumped` / `apk-versioncode-bumped`）。
#   · `same-app-content-refresh`（**只有 `workflow_dispatch` 能选**）：
#     应用版本/versionCode **不变**、只换内容。它的门是**正面断言**（不是把升版门关掉）：
#     APP_VERSION == 线上现值 == 旧已发基线 tag；versionCode/versionName 与基线相等；
#     `android/` 的进包源码除 `assets/content/content.json` 外与基线 tag 逐字节相同；
#     Web 只盖内容修订章；APK 五门（含 `apksigner` 读证书）**照旧真跑**。
#     对照见 docs/design/same-app-content-refresh.md
#
# 用户 2026-10-19 的四条硬要求，本文件逐条落实：
#   1. **checkout 显式取本次发布 tag 指向的 commit**，且流水线里显式校验
#      `RELEASE_TAG` ↔ `release-manifest.sourceCommit` ↔ 实际 `HEAD` **三者一致**（不一致即失败，不构建/不发布）。
#      ⇒ 见 job 头部 `checkout.with.ref` 与「校验 tag ↔ HEAD」/「校验产物清单 ↔ tag ↔ HEAD」两步。
#   2. **新选项只能落在可 dispatch 的 ref 上**：`workflow_dispatch` 只从默认分支（master）触发
#      ⇒ 先把本文件合进 master，再 dispatch；**旧 tag/Release 不受影响**，也不要求旧 tag 里已有 `mode` 选项
#      （本文件里 `inputs.mode` 只在 dispatch 事件下存在，push 事件下 `RELEASE_MODE` 恒为 `release`）。
#   3. **同一 tag 可能产生两次 run**（push→正常升版；dispatch→same-app）：
#      · 只有「显式 `mode=same-app-content-refresh` **且** `dry_run=false` **且**全部门 PASS」那一条能碰
#        Pages / Release / `latest.json`（门在发布步骤**之前**真跑，且 `check-ready` 的结论不 ready 时**退出码非 0**）；
#      · 另一条（正常升版）在**构建前的 preflight 就红**（见「前置闸」），**不构建、不部署、不建 Release**；
#      · 两条共用同一个 `concurrency` 组（同一个 tag ref）⇒ **排队、不互相 cancel**（`cancel-in-progress: false`），
#        于是也不会同时改 `latest.json`。
#   4. **两种模式各自真回归**：正常升版在「应用版本未递增」时**红**（`app-version-bumped`，一字未放松）；
#      same-app 用 `same-app-*` 的**替代正面断言**放行（比“递增”更严：要求三个值**相等**）。
#
# 需要的仓库 secrets（值只由用户设置，仓库里只有名字）：
#   SUOFEI_KEYSTORE / SUOFEI_KEYSTORE_PASSWORD / SUOFEI_KEY_ALIAS / SUOFEI_KEY_PASSWORD
# 见 docs/design/ci-and-signing.md

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布/校验的 tag（形如 v0.1.4+content-2026.10.19.3）。**必须与所选的 ref 是同一个 tag**：本工作流按它 checkout，并校验它与 HEAD、与产物清单三者一致'
        required: true
      mode:
        description: '发布模式：release=正常升版（默认，要求 APP_VERSION/versionCode 递增）；same-app-content-refresh=同 app 版本只换内容（用替代正面断言，门不放松）'
        type: choice
        options:
          - release
          - same-app-content-refresh
        default: release
      dry_run:
        description: '干跑：只构建 + 跑门，不发 Release、不部署 Pages（要真发布必须显式设为 false）'
        type: boolean
        default: true

permissions:
  contents: write   # 建 Release
  pages: write      # 部署 Pages
  id-token: write   # Pages 部署需要

# 同一个 tag 的两种 run **共用一组** ⇒ 排队执行、`cancel-in-progress: false` ⇒ 不互相 cancel，
# 也不会同时动 Pages / Release / `latest.json`。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # tag 名是两个版本号的唯一来源：v<应用版本>+content-<内容版本>
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # **push 永远是 release（正常升版）**：`inputs.mode` 在 push 事件下不存在 ⇒ 落到 'release'。
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'release' }}
      # 远端更新清单里的「能读这份内容的最小 app versionCode」：**每版发布显式定，不靠默认值**。
      # 当前内容仍是 `formatVersion 3`，只有 0.1.4（vc5）及以后认它 ⇒ 5。
      MIN_APP_VERSION_CODE: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          # 【硬要求 1】**显式取本次发布 tag 的 commit**：
          #   · push（tag 触发）：github.ref_name 就是那个 tag；
          #   · workflow_dispatch：默认会落在**被 dispatch 的 ref（master）的 HEAD** 上 —— 那正是
          #     「在别人的提交上构建却给另一个 tag 贴标」的来源，所以这里改用 `inputs.tag`。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      # ── 【硬要求 1 + 2】tag ↔ HEAD ↔ 模式 三者自洽，否则不构建 ────────────────
      - name: 校验 tag ↔ HEAD ↔ 模式（不一致即失败，不构建、不发布）
        run: |
          set -euo pipefail
          echo "event=${GITHUB_EVENT_NAME}  RELEASE_TAG=${RELEASE_TAG}  RELEASE_MODE=${RELEASE_MODE}"
          case "$RELEASE_MODE" in
            release|same-app-content-refresh) ;;
            *) echo "::error::未知模式 RELEASE_MODE=${RELEASE_MODE}（只接受 release / same-app-content-refresh）"; exit 1 ;;
          esac
          # tag 必须真实存在，并且能解析出 commit
          if ! TAG_SHA=$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}"); then
            echo "::error::refs/tags/${RELEASE_TAG} 不存在或解析不出 commit（tag 拼错，或 checkout 没取到这个 tag）"
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::HEAD=${HEAD_SHA} ≠ tag ${RELEASE_TAG} 指向的 ${TAG_SHA} —— 不得在别的提交上构建却给这个 tag 贴标"
            exit 1
          fi
          echo "RELEASE_TAG_SHA=${TAG_SHA}" >> "$GITHUB_ENV"
          echo "工作树 HEAD == tag ${RELEASE_TAG} 的 commit：${TAG_SHA}"

      # ── 【硬要求 3】正常升版模式**不得**用于「应用版本已发布过」的 tag ──────────
      # 判据是一手事实（git tag 列表），不猜：**同 app 版本还有别的发布 tag** ⇒ 这次就不可能是升版发布
      # （升版的定义就是应用版本变大），那它只能是同 app 版本的内容刷新 ⇒ 必须显式 dispatch 那个模式。
      # 于是「同一 tag 的 push run」在这里就红，**不构建、不部署、不建 Release**，也就碰不到 Pages/latest。
      - name: 前置闸：正常升版模式不得用于「应用版本已发布过」的 tag
        run: |
          set -euo pipefail
          APP_V="${RELEASE_TAG#v}"; APP_V="${APP_V%%+*}"
          if [ "$RELEASE_MODE" = "same-app-content-refresh" ]; then
            echo "模式=same-app-content-refresh：tag 的应用版本 ${APP_V} 按定义**不递增**（由 same-app-* 门正面断言它与线上现值、旧基线 tag 三者相等）。"
            exit 0
          fi
          SAME_VERSION_TAGS=$(git tag -l "v${APP_V}+content-*" | grep -vxF "$RELEASE_TAG" || true)
          if [ -n "$SAME_VERSION_TAGS" ]; then
            echo "::error::tag ${RELEASE_TAG} 的应用版本 ${APP_V} 已有别的发布 tag："
            printf '::error::  %s\n' $SAME_VERSION_TAGS
            echo "::error::⇒ 这是一次**同 app 版本的内容刷新**，正常升版模式的递增门会把它判红（这是故意的）。"
            echo "::error::⇒ 请在可 dispatch 的 ref 上用 workflow_dispatch 显式选 mode=same-app-content-refresh（dry_run=false）重跑。"
            echo "::error::本次 run：不构建、不部署 Pages、不建 Release、不动 latest.json。"
            exit 1
          fi
          echo "模式=release（正常升版）：应用版本 ${APP_V} 之前没有任何发布 tag ⇒ 这是一次真升版。"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装项目本地依赖（ajv）
        # 必需：产物就绪检查里的 schema-validation 会跑 tools/validate-content.mjs，
        # 它依赖 devDependency ajv（不进仓库）。缺了这步该门会如实报红（我们实测到过）。
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（用 runner 预装的，不装已废弃的 'tools' 包）
        # 不用 android-actions/setup-android@v3：它会去装早已从 SDK 仓库移除的 `tools` 包
        # （实测：Warning: Failed to find package 'tools' ⇒ sdkmanager 退出 1 ⇒ 整步失败）。
        # GitHub 的 ubuntu runner 已预装 SDK 并设好 ANDROID_HOME；这里只接受许可并补齐我们需要的组件。
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          # compileSdk 36 / build-tools 36.0.0 与仓库里 android/ 的配置一致；已装则是 no-op
          "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: 定位无头 Chromium（真跑门需要）
        # Linux runner 的浏览器路径名与 Windows 不同；不写死，找不到就为空并在下一步报出来。
        run: |
          set -euo pipefail
          BROWSER=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$BROWSER" ]; then
            echo "::warning::没找到 google-chrome/chromium，真跑门（Web e2e）会失败——请在本步补装或修正路径"
          else
            echo "CHROME_BIN=$BROWSER" >> "$GITHUB_ENV"
            "$BROWSER" --version || true
          fi

      - name: 装中文字体（**必需**：本项目是中文应用）
        # 为何必要：CI runner 上没有 CJK 字体时，无头浏览器把汉字量成**很窄/零宽** ⇒
        # 「超宽行按句读折行」那两条断言的前提（这行比列宽还宽）不成立，产物本身没问题却在 CI 上报红。
        # 本机有系统字体所以看不出来。这里装上并把「确实有中文字体」变成一个 fail-closed 的前置。
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fontconfig
          fc-cache -f >/dev/null 2>&1 || true
          fc-list :lang=zh | head -3
          test -n "$(fc-list :lang=zh)" || { echo "::error::装完仍没有中文字体，汉字宽度相关的断言不可信"; exit 1; }

      - name: 解码签名密钥到临时文件
        env:
          KS_B64: ${{ secrets.SUOFEI_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::缺少 secret SUOFEI_KEYSTORE —— 正式签名无法进行（fail-closed，不退回 debug 签名）"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/suofei-release.jks"
          test -s "$RUNNER_TEMP/suofei-release.jks"

      - name: 编译内容 + 构建已签名 APK + 准备 Web 目录
        env:
          SUOFEI_KEYSTORE: ${{ runner.temp }}/suofei-release.jks
          SUOFEI_KEYSTORE_PASSWORD: ${{ secrets.SUOFEI_KEYSTORE_PASSWORD }}
          SUOFEI_KEY_ALIAS: ${{ secrets.SUOFEI_KEY_ALIAS }}
          SUOFEI_KEY_PASSWORD: ${{ secrets.SUOFEI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 模式开关：**只有显式 same-app-content-refresh 才带**；正常升版**不带**（带上会被门判红，这是故意的）。
          MODE_FLAG=""
          if [ "$RELEASE_MODE" = "same-app-content-refresh" ]; then MODE_FLAG="--same-app-content-refresh"; fi
          echo "build-release 模式：${RELEASE_MODE}（flag=${MODE_FLAG:-无}）/ min-app-version-code=${MIN_APP_VERSION_CODE}"
          node release/build-release.mjs \
            --tag "$RELEASE_TAG" \
            --android-variant release \
            --min-app-version-code "$MIN_APP_VERSION_CODE" \
            --online \
            $MODE_FLAG

      # ── 【硬要求 1】产物清单里记的源提交必须就是 tag 指向的提交 ────────────────
      - name: 校验产物清单 ↔ tag ↔ HEAD（不一致即失败，不发布）
        run: |
          set -euo pipefail
          MANIFEST=release/out/release-manifest.json
          test -s "$MANIFEST"
          # 三者一致：**实际 HEAD**（重新读一次） / tag 指向的 commit / 产物清单里的 sourceCommit
          HEAD_SHA=$(git rev-parse HEAD)
          export HEAD_SHA   # 让下面的 node 自检也能读到（三者一致：HEAD / tag commit / 清单 sourceCommit）
          if [ "$HEAD_SHA" != "$RELEASE_TAG_SHA" ]; then
            echo "::error::HEAD=${HEAD_SHA} 已不等于 checkout 时的 tag commit ${RELEASE_TAG_SHA}（工作树被换过？）"
            exit 1
          fi
          node - "$MANIFEST" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const m = JSON.parse(fs.readFileSync(path, 'utf8'));
          const wantTag = process.env.RELEASE_TAG;
          const wantSha = process.env.RELEASE_TAG_SHA;
          const headSha = process.env.HEAD_SHA;
          const wantMode = process.env.RELEASE_MODE === 'same-app-content-refresh' ? 'same-app-content-refresh' : 'full';
          const got = {
            tag: m.releaseTag?.name ?? null,
            sha: m.sourceCommit ?? null,
            mode: m.mode ?? null,
          };
          const bad = [];
          if (wantSha !== headSha) bad.push(`tag commit ${JSON.stringify(wantSha)} ≠ 实际 HEAD ${JSON.stringify(headSha)}`);
          if (got.tag !== wantTag) bad.push(`release-manifest.releaseTag.name=${JSON.stringify(got.tag)} ≠ RELEASE_TAG=${JSON.stringify(wantTag)}`);
          if (got.sha !== wantSha) bad.push(`release-manifest.sourceCommit=${JSON.stringify(got.sha)} ≠ tag/HEAD=${JSON.stringify(wantSha)}`);
          if (got.mode !== wantMode) bad.push(`release-manifest.mode=${JSON.stringify(got.mode)} ≠ 本次模式 ${JSON.stringify(wantMode)}`);
          if (bad.length) {
            for (const b of bad) console.log(`::error::${b}`);
            process.exit(1);
          }
          console.log(`产物清单自洽：tag=${got.tag} / sourceCommit=${got.sha}（== HEAD == tag commit） / mode=${got.mode}`);
          NODE

      - name: 产物就绪检查（含 apksigner 签名证书不是 debug 那条门）
        # 门在两种模式下的对照见 docs/design/same-app-content-refresh.md §4。
        # ⚠ 这一步**必须**紧挨在发布步骤之前，且它的退出码是发布步骤的唯一闸门：
        #   release/check-ready.mjs 的结论不是「就绪」时**退出码非 0**（曾经黄/跳过也 exit 0，那会让 CI 照发）。
        run: |
          set -euo pipefail
          MODE_FLAG=""
          if [ "$RELEASE_MODE" = "same-app-content-refresh" ]; then MODE_FLAG="--same-app-content-refresh"; fi
          node release/check-ready.mjs --out release/out $MODE_FLAG

      - name: 上传产物（供下载与排障）
        uses: actions/upload-artifact@v4
        with:
          name: suofei-release-artifacts
          path: release/out/**
          if-no-files-found: error

      # ── 发布步骤：**只有真发布**才跑（干跑不跑），且必然在上面的门全绿之后 ────
      - if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        uses: actions/configure-pages@v5
      - if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/out/web

      - name: 生成 Release 说明（按模式选模板，再把 tag 里的版本号与基线内容版本注入）
        # 说明要写清「旧 APK 保旧、需同签名新 APK 覆盖、旧 ASCII 深链接失效、未验证边界」——
        # 一句话的 --notes 装不下（2026-10-16 发布 0.1.2 时改成真说明文件）。
        # **模式不同、说明也不同**：0.1.4 那种升版与「同 app 版本只换内容」不是一回事，
        # 用同一份模板会写出与产物不符的话（应用版本到底变没变）。
        run: |
          set -euo pipefail
          APP_V="${RELEASE_TAG#v}"; APP_V="${APP_V%%+*}"
          CONTENT_V="${RELEASE_TAG##*+content-}"
          NOTES_SRC=release/notes/release-notes.md
          if [ "$RELEASE_MODE" = "same-app-content-refresh" ]; then
            # ⚠️ 2026-10-23（实战事故）：**模板里绝不写具体批次的内容**。
            # 原先本模板把「新增哪首／合计几首几组」写死（是 .19.3 那一批的描述），结果 .20.1 与 .23.4
            # 两次同格式发布的 Release 正文都把**上一批**的描述又发了一遍（.23.4 真实是 28 → 31 首、
            # 新增三首，正文却还写「新增望岳、 23 首 / 3 组」）。现在：**逐版说明文件优先**。
            NOTES_SRC=release/notes/release-notes-same-app.md
            PER_RELEASE="release/notes/release-notes-same-app-${CONTENT_V}.md"
            if [ -f "$PER_RELEASE" ]; then
              NOTES_SRC="$PER_RELEASE"
              echo "使用逐版说明：${PER_RELEASE}"
            else
              echo "::warning::没有 ${PER_RELEASE}：退到通用模板（模板不含本批具体内容，发布说明里「这一版有什么」会是空的）"
            fi
          fi
          PREV_CONTENT_V=$(node -e "const m=require('./release/out/release-manifest.json');process.stdout.write(String(m.previousVersion??''))")
          VC=$(node -e "const m=require('./release/out/release-manifest.json');process.stdout.write(String(m.app?.versionCode??''))")
          sed -e "s/@TAG@/${RELEASE_TAG}/g" \
              -e "s/@APP_VERSION@/${APP_V}/g" \
              -e "s/@CONTENT_VERSION@/${CONTENT_V}/g" \
              -e "s/@PREVIOUS_CONTENT_VERSION@/${PREV_CONTENT_V}/g" \
              -e "s/@VERSION_CODE@/${VC}/g" \
            "$NOTES_SRC" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          echo "说明已注入：模板=${NOTES_SRC} APP_VERSION=${APP_V} / CONTENT_VERSION=${CONTENT_V}（上一版内容 ${PREV_CONTENT_V}）/ versionCode=${VC}"
          echo "NOTES_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: 建 GitHub Release 并附 APK（幂等：重跑不会因「Release 已存在」失败）
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls release/out/apk/*.apk)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在——只把这次的 APK 传上去（--clobber 覆盖同名资产）"
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" \
              --target "$RELEASE_TAG_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES_FILE"
          fi
          gh release view "$RELEASE_TAG" --json tagName,assets --jq '{tag:.tagName, assets:[.assets[].name]}'

  deploy-pages:
    needs: build
    # 干跑（手动触发且 dry_run=true）不部署；push 与「显式 dry_run=false 的 dispatch」才部署。
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
