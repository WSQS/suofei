<!doctype html>
<html lang="zh-Hans-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>索斐</title>
  <link rel="manifest" href="manifest.json">
  <!-- 图标：启动图标＝N1（单字「索」轮廓＋accent 角标）；标签页图标＝另一套无字极简记号（用户 2026-10-15 裁决）。
       两套都是**矢量轮廓**、不依赖系统字体（这里刻意不再内联 data: URI 的 favicon——
       旧的那份用 <text> 画字，没有系统字体就会变成另一个字形，且离线也靠不住）。 -->
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="#/" data-test="site-title">索斐</a>
  </header>

  <div id="notices" class="notices" data-test="notices"></div>

  <main id="view" class="view-host" data-test="view">
    <!-- 静态占位：JS 与内容都还没到时候，页面上也有可读状态（不是白屏） -->
    <p class="view-hint" data-test="view-loading">正在装载站点…</p>
  </main>

  <script type="module" src="app/main.js"></script>
</body>
</html>
